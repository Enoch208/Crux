[project]
name = "crux"
version = "0.1.0"
description = "Counterexample-guided robotic controller repair using Radeon-parallel physical futures"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
crux = "crux.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crux"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "ERA",
    "TID",
    "ANN",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"src/crux/simulation/gate*.py" = ["B009"]
"src/crux/simulation/rig.py" = ["B009"]
"src/crux/simulation/taskscene.py" = ["B009"]
"src/crux/simulation/batchscene.py" = ["B009", "SLF001"]
"src/crux/simulation/recording.py" = ["B009"]
"src/crux/control/baseline.py" = ["B009"]
"upstream/*.py" = ["BLE001", "T201", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "genesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
